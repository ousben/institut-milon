<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ showCta }}" hint-placeholder-val="{{ true }}">
<a id="contact" href="Contact Milon.dc.html" style="display:block;background:#a41034;color:#ffffff;text-decoration:none;transition:color 200ms ease, background-color 200ms ease, border-color 200ms ease" style-hover="background:#7e0c28;color:#ffffff">
    <span style="max-width:1440px;margin:0 auto;padding:40px clamp(20px,3vw,48px);box-sizing:border-box;display:flex;flex-wrap:wrap;align-items:center;gap:16px 64px">
      <span style="flex:0 0 auto;font-size:26px;font-weight:800;letter-spacing:-0.015em">Échanger avec l’Institut</span>
      <span style="flex:1 1 360px;font-size:clamp(20px,2vw,26px);line-height:1.3">Parce qu’un jeune ne grandit jamais seul.</span>
      <span data-arrow="right" aria-hidden="true" style="font-size:32px;line-height:1;display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span>
    </span>
  </a>
</sc-if>
<footer style="background:#222222;color:#ffffff">
  <div style="max-width:1440px;margin:0 auto;padding:clamp(56px,6vw,88px) clamp(20px,3vw,48px) 32px;box-sizing:border-box">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:40px">
      <a href="Landing Milon.dc.html" aria-label="Institut Milon, accueil" style="display:flex;align-items:center;gap:14px;align-self:start;color:#ffffff;text-decoration:none;transition:opacity 250ms ease" style-hover="opacity:0.8">
        <span aria-hidden="true" style="display:block;flex:none;width:54px;height:56px;background:#ffffff;-webkit-mask:url(assets/logo/embleme-masque-400.png) center / contain no-repeat;mask:url(assets/logo/embleme-masque-400.png) center / contain no-repeat"></span>
        <span aria-hidden="true" style="display:flex;flex-direction:column;gap:4px"><span style="font-size:12px;font-weight:600;letter-spacing:.34em;line-height:1">INSTITUT</span><span style="font-size:30px;font-weight:700;letter-spacing:.02em;line-height:.85">MILON</span></span>
      </a>
      <div style="display:flex;flex-direction:column;gap:12px;font-size:18px;line-height:1.45">
        <p style="margin:0;font-weight:700;color:#ffffff">Institut Milon</p>
        <p style="margin:0;color:#ffffff">8 rue du Colisée<br>75008 Paris</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-size:18px;line-height:1.3">
        <a href="Contact Milon.dc.html" style="color:#ffffff;text-decoration-line:underline;text-decoration-color:#ffffff;text-decoration-thickness:1px;text-underline-offset:.25em;transition:color 250ms ease, text-decoration-color 250ms ease" style-hover="color:#bdbdbd;text-decoration-color:#bdbdbd">Nous contacter</a>
        <a href="Cookies Milon.dc.html#preferences" style="color:#ffffff;text-decoration-line:underline;text-decoration-color:#ffffff;text-decoration-thickness:1px;text-underline-offset:.25em;transition:color 250ms ease, text-decoration-color 250ms ease" style-hover="color:#bdbdbd;text-decoration-color:#bdbdbd">Gérer mes cookies</a>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 40px;margin-top:clamp(48px,6vw,88px);padding-top:24px;border-top:1px solid #444444;font-size:15px;line-height:1.4;color:#bdbdbd">
      <span style="flex:0 0 calc(25% - 30px);min-width:200px">© 2026 Institut Milon</span>
      <nav aria-label="Informations du site" style="flex:1 1 360px;display:flex;flex-wrap:wrap;gap:8px 24px">
        <a href="Plan du site Milon.dc.html" style="color:#bdbdbd;text-decoration:none;transition:color 250ms ease" style-hover="color:#ffffff">Plan du site</a>
        <a href="Mentions legales Milon.dc.html" style="color:#bdbdbd;text-decoration:none;transition:color 250ms ease" style-hover="color:#ffffff">Mentions légales</a>
        <a href="Confidentialite Milon.dc.html" style="color:#bdbdbd;text-decoration:none;transition:color 250ms ease" style-hover="color:#ffffff">Confidentialité</a>
        <a href="Cookies Milon.dc.html" style="color:#bdbdbd;text-decoration:none;transition:color 250ms ease" style-hover="color:#ffffff">Cookies</a>
        <a href="Accessibilite Milon.dc.html" style="color:#bdbdbd;text-decoration:none;transition:color 250ms ease" style-hover="color:#ffffff">Accessibilité</a>
      </nav>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:&quot;560px&quot;},&quot;cta&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Bandeau « Échanger avec l’Institut »&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      showCta: this.props.cta ?? true,
    };
  }
}
</script>
</body>
</html>
