          <a href="Landing Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">Accueil<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>
          <a href="Institut Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">L’Institut<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>
          <a href="Approche Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">Notre approche<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>
          <a href="Formations Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">Formations<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>
          <a href="Contact Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">Contact<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>

          <a href="Mentions legales Milon.dc.html" style="display:flex;justify-content:space-between;align-items:center;gap:24px;padding:clamp(18px,2vw,28px) 0;border-top:1px solid #c8c8c8;font-size:clamp(26px,2.8vw,40px);font-weight:300;line-height:1.1;letter-spacing:-0.025em;color:#222222;text-decoration:none;transition:color 250ms ease" style-hover="color:#a41034;text-decoration:none">Mentions légales<span data-arrow="right" aria-hidden="true" style="display:inline-block;transition:transform 250ms cubic-bezier(0.2, 0, 0, 1)">→</span></a>

<dc-import name="Milon Footer" hint-size="100%,560px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  titleRef = React.createRef();
  // Taille commune à tous les titres de hero du site (référence : « Comprendre. / Mettre en pratique. / Transmettre. »)
  heroProbe = () => {
    if (this.probe) return this.probe;
    const lines = ['Un champion ne se', 'fait jamais seul.', 'La force se transmet.', 'Comprendre.', 'Mettre en pratique.', 'Transmettre.', 'Former ceux', 'qui accompagnent.'];
    const p = document.createElement('div');
    p.setAttribute('aria-hidden', 'true');
    p.style.cssText = 'position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none';
    p.innerHTML = '<div data-w style="font-size:100px;font-weight:800;line-height:1.18;letter-spacing:-0.035em;white-space:nowrap">' + lines.map((l) => '<span style="display:block;width:max-content">' + l + '</span>').join('') + '</div>'
      + '<div data-row style="display:flex;flex-wrap:wrap;gap:16px 64px;align-items:flex-end;justify-content:space-between"><p style="margin:0;max-width:46ch;font-size:clamp(17px, 0.9rem + 0.4vw, 20px);line-height:1.5;text-wrap:pretty">Une formation doit laisser des repères qui servent sur le terrain et au quotidien. Nous partons de situations concrètes, expliquons simplement les notions importantes, puis cherchons à rendre les connaissances applicables aux besoins des participants.</p><div style="display:flex;flex-wrap:wrap;gap:12px 32px"><span style="font-size:17px;font-weight:700;padding:10px 0">Voir les trois étapes →</span><span style="font-size:17px;font-weight:700;padding:10px 0">Échanger avec nous →</span></div></div>';
    document.body.appendChild(p);
    this.probe = p;
    return p;
  };
  fitTitle = () => {
    const h1 = this.titleRef.current || document.querySelector('main h1');
    if (!h1) return;
    const width = h1.clientWidth;
    if (!width) return;
    const p = this.heroProbe();
    const row = p.querySelector('[data-row]');
    row.style.width = width + 'px';
    let ref = 0;
    p.querySelectorAll('[data-w] span').forEach((s) => { ref = Math.max(ref, s.getBoundingClientRect().width); });
    if (!ref) return;
    const byWidth = (width * 0.985) / (ref / 100);
    const vh = Math.min(window.innerHeight, document.documentElement.clientHeight || window.innerHeight);
    const vw = window.innerWidth;
    const c = (a, v, b) => Math.max(a, Math.min(b, v));
    const header = document.querySelector('header');
    // Marges du hero de référence (L’Institut, Notre approche, Formations) : même taille de titre sur toutes les pages
    const used = (header ? header.offsetHeight : 72) + c(24, vh * 0.04, 48) + c(20, vw * 0.03, 48) + 2 * c(24, vh * 0.04, 64) + row.offsetHeight + vh * 0.04;
    const byHeight = (vh - used) / (3 * 1.18 + 0.1);
    const fs = parseFloat(getComputedStyle(h1).fontSize);
    let own = 0;
    h1.querySelectorAll('[data-line]').forEach((l) => { own = Math.max(own, l.getBoundingClientRect().width); });
    const byOwn = fs && own ? (width * 0.985) / (own / fs) : Infinity;
    document.documentElement.style.setProperty('--hero-fs', Math.max(24, Math.min(176, byWidth, byHeight, byOwn)).toFixed(1) + 'px');
  };
  componentDidMount() {
    this.fitTitle();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(this.fitTitle);
    window.addEventListener('resize', this.fitTitle);
    setTimeout(this.fitTitle, 300);
  }
  componentWillUnmount() {
    window.removeEventListener('resize', this.fitTitle);
    if (this.probe) this.probe.remove();
  }
  renderVals() {
    return {
      titleRef: this.titleRef,
    };
  }
}
</script>
</body>
